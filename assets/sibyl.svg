<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Sibyl</title>
  <desc id="desc">A hand-authored ASCII-inspired SIBYL wordmark in yellow and orange with offset outline lettering</desc>
  <defs>
    <clipPath id="upper">
      <rect x="0" y="0" width="1200" height="155"/>
    </clipPath>
  </defs>
  <rect width="1200" height="300" fill="#111111"/>
  <g text-anchor="middle" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="190" font-weight="900" letter-spacing="-12">
    <text x="600" y="214" fill="none" stroke="#6b421e" stroke-width="4">SIBYL</text>
    <text x="608" y="222" fill="none" stroke="#d0812d" stroke-width="3">SIBYL</text>
    <text x="600" y="214" fill="#d0812d" stroke="#d0812d" stroke-width="2">SIBYL</text>
    <text x="600" y="204" fill="#ffd400" stroke="#ffd400" stroke-width="2" clip-path="url(#upper)">SIBYL</text>
    <text x="600" y="204" fill="none" stroke="#3b2d0a" stroke-width="3" clip-path="url(#upper)">SIBYL</text>
  </g>
</svg>
